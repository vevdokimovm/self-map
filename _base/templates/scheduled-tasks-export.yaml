# scheduled-tasks-export.yaml — портируемый манифест расписанных задач
#
# Назначение: перенос системы scheduled tasks на любой аккаунт Claude (V/J/M/S).
# Задачи привязаны к аккаунту (list/update/delete видят только свой) — переносим РЕЦЕПТ, не объект.
# Механика и протокол переноса — 00-infrastructure/34-cowork-scheduled-tasks.md §6.
#
# Как развернуть на новом аккаунте (Cowork-сессия):
#   1) Подключить коннекторы из поля `requires` каждой задачи (иначе задача бежит вслепую) — док 35.
#   2) Сказать Claude: «Заведи scheduled tasks по этому манифесту через create_trigger».
#   3) Проверить list_triggers → сверить next_run_at.
#
# Поля задачи:
#   name          — имя задачи
#   cron          — 5-полей "мин час день мес день_недели" (МСК); интервал ≥ час
#   requires      — коннекторы, без которых задача бесполезна (док 35)
#   notifications — каналы уведомления (push/email)
#   prompt        — САМОДОСТАТОЧНОЕ ТЗ: свежая сессия не помнит ни чата, ни этого файла

version: "1.0"
timezone: "Europe/Moscow"
owner_accounts: [V, J, M, S]
default_notifications: { push: true, email: false }

tasks:
  - id: 1
    name: "Утренний брифинг"
    cron: "30 5 * * *"
    requires: [google_calendar, gmail]
    notifications: { push: true, email: false }
    prompt: >
      Запусти скилл `morning` и собери утренний бриф на сегодня. Источники: все подключённые
      Google-календари (события дня + завтрашний контекст) и Gmail (письма, требующие ответа/
      непрочитанные за 2 дня). Добавь короткий блок новостей Tech/AI и новостей по миграции
      (Швеция/Скандинавия/Канада). Отдай HTML-бриф. Это фоновая расписанная задача — просто
      отрендери бриф, ничего у пользователя не спрашивай.

  - id: 2
    name: "FINPILOT: мониторинг CI и лимитов GitHub"
    cron: "0 * * * *"
    requires: [gmail]
    notifications: { push: true, email: false }
    prompt: >
      Проверь Gmail на НОВЫЕ непрочитанные письма от notifications@github.com и noreply@github.com
      по репозиторию personal-finance-dss за последний час: (а) упавший CI (Run failed / job'ы
      «Быстрый», «Линтеры»), (б) исчерпание Actions-минут (usage warning). Если есть — пришли пуш
      с кратким списком (что упало, какой коммит/тег, ссылка на прогон) и сними метку UNREAD с
      обработанных писем, чтобы не дублировать в следующий час. Если нового нет — не присылай ничего.

  - id: 3
    name: "Карьера: вакансии с релокацией + IT-школы"
    cron: "0 8 * * 1"
    requires: []
    notifications: { push: true, email: false }
    prompt: >
      Собери дайджест (веб-поиск): (1) актуальные вакансии Junior/Intern Python backend с релокацией
      в Скандинавию (Швеция/Дания/Финляндия/Норвегия), Канаду — без спама и без «удалёнки без визы»;
      (2) открытые окна регистрации в IT-школы/интенсивы (Школа 21, Яндекс по алгоритмам/ML и т.п.).
      Кратко, ссылками, приоритет — релокация компанией. Пришли пуш.

  - id: 4
    name: "Стратегический дайджест: право и магистратура"
    cron: "0 7 1,15 * *"
    requires: []
    notifications: { push: true, email: false }
    prompt: >
      Три блока (веб-поиск, кратко, ссылками): (1) миграционное право Швеции и соседей — изменения,
      рабочие визы, релокация; (2) изменения в военном законодательстве РФ / мобилизации / повестках
      (реалии круглогодичного призыва и электронных повесток); (3) дедлайны магистерских программ
      (МИСИС/МФТИ/Сколтех/ИТМО/СПбГУ/Иннополис), IT-направления, бюджет. Пришли пуш.

  - id: 5
    name: "Донорство: проверка цикла"
    cron: "0 9 * * 1"
    requires: [gmail]
    notifications: { push: true, email: false }
    prompt: >
      Найди в Gmail последнее письмо-подтверждение донации плазмы/тромбоцитов (центр крови Царицыно),
      определи дату. Вычисли, сколько дней прошло. Если ≥14 дней — пришли пуш «пора записаться,
      прошло N дней». Если меньше — ничего не присылай.

  - id: 6
    name: "Weekly review"
    cron: "0 19 * * 0"
    requires: [gmail, google_calendar]
    notifications: { push: true, email: false }
    prompt: >
      Итоги недели прозой (без нотаций): (1) CI/релизы FINPILOT по письмам GitHub Actions в Gmail за
      7 дней (что падало, какие теги вышли); (2) ритм по календарю — прошедшая неделя и что на
      следующей; (3) статус донорского цикла (когда последняя донация, пора ли). Пришли пуш.

  - id: 7
    name: "Магистратура: портфолио + IELTS"
    cron: "0 8 1,15 * *"
    requires: []
    notifications: { push: true, email: false }
    prompt: >
      Собери (веб-поиск): (1) возможности для очков в портфолио магистратуры — олимпиады («Я —
      профессионал» и т.п.), конференции, публикации по IT/теме FINPILOT, регистрация ПО (Роспатент),
      Дни науки МИСИС; (2) актуальные даты и окна регистрации IELTS в Москве. Кратко, ссылками. Пуш.

  - id: 8
    name: "Ежемесячный чек-лист: бумаги и репозитории"
    cron: "0 12 1 * *"
    requires: []
    notifications: { push: true, email: false }
    prompt: >
      Мягкое напоминание-чеклист (без давления): (1) долгие бюрократические процессы под миграцию —
      загранпаспорт (срок/продление), нотариальные переводы дипломов, финансовая подушка; (2) гигиена
      repos-map — пройтись по живым репам (self-map, health-vault, it-base…) как по системе активных
      конспектов, а не архиву: что устарело/раздулось/просит сжатия. Пришли пуш со списком на месяц.

# ── Заметки по переносу ────────────────────────────────────────────────────────────────────────
# - Задачи 2/5/6 бесполезны без Gmail; 1/6 — без Google Calendar. Сперва коннекторы (док 35), потом задачи.
# - Часы указаны в МСК (UTC+3). На аккаунте в другой зоне — пересчитать час в cron.
# - Уведомления: только push. Хочешь и почту — выставь email: true у нужных задач.
# - После заведения — list_triggers, сверить next_run_at и что все 8 на месте.
